<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liam — the living room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Karla:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — daylight is default. body.night is the same room
   after someone hits the light switch.
   ============================================================ */
:root{
  --wall:#EDE6D9;
  --ceiling:#F6F1E7;
  --wood:#B0713A;
  --wood-dk:#8A5326;
  --wood-lt:#C48B52;
  --floor:#95633A;
  --brick:#A9663F;
  --sky:#D6E4EA;
  --leaf:#6F8C4C;
  --screen:#14171C;
  --ball:#C9682F;        /* the accent — it's the basketball */
  --ink:#2A1D12;
  --ink-dim:#6E5942;
  --white:#F2EFE7;
  --edge:rgba(42,29,18,.16);
  --page:#F6F1E7;

  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Karla',system-ui,sans-serif;
  --util:'Space Mono',ui-monospace,monospace;
}
body.night{
  --wall:#241D16; --ceiling:#1B1610; --page:#15110C;
  --wood:#5A3A1E; --wood-dk:#3E2713; --wood-lt:#6E4926;
  --floor:#402916; --brick:#54331F; --sky:#101A2B; --leaf:#243318;
  --ink:#EFE7D8; --ink-dim:#9C8A73; --white:#CFC7B8;
  --edge:rgba(239,231,216,.16);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:var(--body);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .6s ease,color .6s ease}

.masthead{display:flex;justify-content:space-between;align-items:baseline;gap:24px;
  padding:22px clamp(18px,4vw,48px);border-bottom:1px solid var(--edge);flex-wrap:wrap}
.masthead h1{font-family:var(--display);font-weight:800;font-size:clamp(19px,2.4vw,26px);
  letter-spacing:-.02em;margin:0}
.masthead p{font-family:var(--util);font-size:12px;color:var(--ink-dim);margin:0;max-width:52ch}

.room-wrap{position:relative;width:100%}
.room{display:block;width:100%;height:auto;max-height:80vh}

.obj{cursor:pointer;outline:none}
.obj .hit{fill:transparent}
.obj .lift{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.obj:hover .lift,.obj:focus-visible .lift{transform:translateY(-7px)}
.obj .tag{font-family:var(--util);font-size:13px;fill:var(--ink);opacity:0;transition:opacity .22s}
.obj .tag-bg{fill:var(--page);opacity:0;transition:opacity .22s}
.obj:hover .tag,.obj:focus-visible .tag,
.obj:hover .tag-bg,.obj:focus-visible .tag-bg{opacity:1}
.obj:focus-visible .outline{stroke:var(--ink);stroke-width:2;stroke-dasharray:5 4}
.outline{fill:none;stroke:transparent}

#night-scrim{opacity:0;transition:opacity 1s ease}
body.night.on #night-scrim{opacity:.93}
#glow{opacity:0;transition:opacity 1s ease}
body.night.on #glow{opacity:.4}
body.night.on #tv.tv-on ~ #glow{opacity:.5}
#tv-screen-bg{opacity:0;transition:opacity .3s ease}
#tv.tv-on #tv-screen-bg{opacity:1}
#screen-content{opacity:0;pointer-events:none;transition:opacity .45s ease .45s}
#tv.tv-on #screen-content{opacity:1;pointer-events:auto}
#crt{transform-origin:center;transform:scaleY(.004);opacity:0;pointer-events:none}
#tv.tv-on #crt{animation:crt .65s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes crt{0%{transform:scaleY(.004);opacity:1}55%{transform:scaleY(1);opacity:.8}100%{transform:scaleY(1);opacity:0}}
#tv-prompt{pointer-events:none;animation:tvPulse 1.8s ease-in-out infinite}
#tv.tv-on #tv-prompt{display:none}
@keyframes tvPulse{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#tv-prompt{animation:none;opacity:.85}}

.tile rect{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.28);stroke-width:1;transition:fill .18s,stroke .18s}
.tile text{font-family:var(--util);font-size:14px;fill:#EFEAE0}
.tile{cursor:pointer;outline:none}
.tile:hover rect,.tile:focus-visible rect{fill:rgba(214,228,234,.28);stroke:#EFEAE0}

.roombar{display:flex;justify-content:center;align-items:center;gap:20px;padding:14px 0 4px;
  font-family:var(--util);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
.lights{font:inherit;background:none;border:1px solid var(--edge);color:var(--ink-dim);
  padding:6px 12px;cursor:pointer;border-radius:2px;letter-spacing:.08em}
.lights:hover{border-color:var(--ink);color:var(--ink)}

.scrim{position:fixed;inset:0;background:rgba(26,17,9,.66);opacity:0;pointer-events:none;
  transition:opacity .3s;z-index:20}
body.open .scrim{opacity:1;pointer-events:auto}
.panel{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:86vh;overflow-y:auto;
  background:var(--page);border-top:2px solid var(--ball);
  transform:translateY(101%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
body.open .panel{transform:translateY(0)}
.panel-inner{max-width:760px;margin:0 auto;padding:clamp(26px,5vw,52px) clamp(20px,5vw,40px) 60px}
.eyebrow{font-family:var(--util);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ball);margin:0 0 10px}
.panel h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,5vw,44px);
  letter-spacing:-.025em;margin:0 0 18px;line-height:1.05}
.panel p{font-size:17px;line-height:1.65;margin:0 0 16px;max-width:62ch}
.placeholder{border-left:2px solid var(--ball);padding:12px 0 12px 16px;
  color:var(--ink-dim);font-size:15px;line-height:1.6}
.placeholder strong{color:var(--ink);font-weight:500}
.close{position:sticky;top:0;float:right;font-family:var(--util);font-size:12px;background:none;
  border:1px solid var(--edge);color:var(--ink);padding:8px 14px;cursor:pointer;border-radius:2px}
.close:hover{border-color:var(--ink)}

.index{border-top:1px solid var(--edge);padding:clamp(24px,5vw,44px)}
.index h3{font-family:var(--util);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-dim);font-weight:400;margin:0 0 16px}
.index ul{list-style:none;margin:0;padding:0;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--edge)}
.index button{width:100%;text-align:left;background:var(--page);border:0;color:var(--ink);
  font-family:var(--display);font-size:17px;padding:18px 16px;cursor:pointer;transition:background .18s}
.index button:hover{background:var(--wall)}
.index span{display:block;font-family:var(--util);font-size:11px;color:var(--ink-dim);margin-top:5px}

footer{padding:26px clamp(18px,4vw,48px) 44px;border-top:1px solid var(--edge);
  font-family:var(--util);font-size:11px;color:var(--ink-dim)}

@media (max-width:760px){.room{max-height:none}.obj .tag,.obj .tag-bg{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}
  #screen-content{opacity:1}}
</style>
</head>
<body>

<header class="masthead">
  <h1>Liam</h1>
  <p>Economics &amp; business, Cal Poly SLO. Summer at AlphaSights in New York.</p>
</header>

<div class="room-wrap">
<svg class="room" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" role="img"
  aria-label="The living room — being rebuilt with new photos">
<defs>
  <radialGradient id="g" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#BFD8E6" stop-opacity=".85"/>
    <stop offset="100%" stop-color="#BFD8E6" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
</defs>

<!-- ============ ROOM — cleared, waiting for new background photo + items ============ -->
<rect x="0" y="0" width="1440" height="900" fill="var(--wall)"/>
<text x="720" y="450" text-anchor="middle" font-family="'Space Mono',monospace" font-size="22" fill="var(--ink-dim)">room cleared — add the new background photo here</text>

<rect id="night-scrim" x="0" y="0" width="1440" height="900" fill="#12151D" style="pointer-events:none"/>
<ellipse id="glow" cx="602" cy="420" rx="380" ry="260" fill="url(#g)" style="pointer-events:none"/>

</svg>

<div class="roombar">
  <span>click around the room</span>
  <button class="lights" id="lights" aria-pressed="false">turn the lights off</button>
</div>
</div>

<nav class="index">
  <h3>Everything in the room</h3>
  <ul>
    <li><button data-panel="work">Work<span>alphasights, new york</span></button></li>
    <li><button data-panel="thesis">Who you know<span>the argument</span></button></li>
    <li><button data-panel="now">Now<span>currently</span></button></li>
    <li><button data-panel="watchlist">Watchlist<span>on the tv</span></button></li>
    <li><button data-panel="journal">The journal<span>writing</span></button></li>
    <li><button data-panel="camera">The camera<span>photos</span></button></li>
    <li><button data-panel="fridge">The fridge<span>what's stocked</span></button></li>
    <li><button data-panel="window">The window<span>what's next</span></button></li>
    <li><button data-panel="speakers">The speakers<span>what's playing</span></button></li>
    <li><button data-panel="board">The surfboard<span>the beach</span></button></li>
    <li><button data-panel="hello">Say hi<span>contact</span></button></li>
  </ul>
</nav>

<footer>Built in a house in San Luis Obispo · <span id="yr"></span></footer>

<div class="scrim" data-close></div>
<section class="panel" role="dialog" aria-modal="true" aria-labelledby="ph" hidden>
  <div class="panel-inner">
    <button class="close" data-close>close</button>
    <p class="eyebrow" id="pe"></p><h2 id="ph"></h2><div id="pb"></div>
  </div>
</section>

<script>
/* ============================================================
   CONTENT — the only thing you need to edit.
   One entry per clickable object. Replace the placeholders.
   ============================================================ */
const CONTENT = {
  tv:        {eyebrow:'the tv', title:'Pick something',
              body:`<p>Everything on the home screen opens a room of its own. Start anywhere.</p>`},
  work:      {eyebrow:'work', title:'AlphaSights, New York',
              body:`<div class="placeholder"><strong>PLACEHOLDER.</strong> Ten weeks connecting private equity firms to the experts who could actually answer their question. Write the bar version, not the résumé version — what a day looked like, the hardest search, what you got wrong in week one.</div>`},
  thesis:    {eyebrow:'the argument', title:'It&rsquo;s who you know',
              body:`<div class="placeholder"><strong>PLACEHOLDER.</strong> Anyone can learn anything, so the scarce thing isn't knowledge — it's access. Make the case. This is the piece that ties the job to the belief.</div>`},
  now:       {eyebrow:'currently', title:'Now',
              body:`<div class="placeholder"><strong>PLACEHOLDER.</strong> What you're reading, building, and thinking about this month, with a last-updated date. Cheap to write, and it's what proves the site is alive.</div>`},
  watchlist: {eyebrow:'on the tv', title:'Watchlist',
              body:`<div class="placeholder"><strong>PLACEHOLDER.</strong> Films, and what you noticed in them. The Nolan rabbit hole lives here.</div>`},
  journal:   {eyebrow:'the journal', title:'Writing',
              body:`<div class="placeholder"><strong>PLACEHOLDER.</strong> Your longer pieces. Two good ones beat eight thin ones — don't launch with an empty index. When you have a few, this becomes a list with dates.</div>`},
  camera:    {eyebrow:'the camera', title:'Photos',
              body:`<div class="placeholder"><strong>PLACEHOLDER.</strong> A grid of your own photos. Shoot on something with a cord and it'll look like yours instead of stock. Captions matter more than the images — a photo with one specific line under it beats a gallery with none.</div>`},
  fridge:    {eyebrow:'the fridge', title:'What&rsquo;s stocked',
              body:`<div class="placeholder"><strong>PLACEHOLDER.</strong> Not what you eat — what's in there because people are coming over. This is where hosting goes: friends showing up for everything, spending on other people, being the guy the house runs through.</div>`},
  window:    {eyebrow:'the window', title:'What&rsquo;s out there',
              body:`<div class="placeholder"><strong>PLACEHOLDER.</strong> The room is the people. The window is the ambition — New York at 11:30pm, the next five years, the business you want to build, the people you want to develop.</div>`},
  speakers:  {eyebrow:'the speakers', title:'What&rsquo;s playing',
              body:`<div class="placeholder"><strong>PLACEHOLDER.</strong> Music. Consider embedding a live playlist so it updates without you touching the code.</div>`},
  board:     {eyebrow:'the surfboard', title:'The beach',
              body:`<div class="placeholder"><strong>PLACEHOLDER.</strong> The coast, four years in SLO, what you'll miss when you leave.</div>`},
  hello:     {eyebrow:'say hi', title:'Get in touch',
              body:`<div class="placeholder"><strong>PLACEHOLDER.</strong> Email, LinkedIn, one warm line inviting people to reach out. Given your whole argument, this should be the friendliest page on the site.</div>`}
};

const panel=document.querySelector('.panel');
let lastFocus=null;
function open(key){
  const c=CONTENT[key]; if(!c) return;
  lastFocus=document.activeElement;
  document.getElementById('pe').innerHTML=c.eyebrow;
  document.getElementById('ph').innerHTML=c.title;
  document.getElementById('pb').innerHTML=c.body;
  panel.hidden=false;
  requestAnimationFrame(()=>document.body.classList.add('open'));
  panel.querySelector('.close').focus();
}
function close(){
  document.body.classList.remove('open');
  setTimeout(()=>{panel.hidden=true;},400);
  if(lastFocus) lastFocus.focus();
}
function toggleTV(){
  const tv=document.getElementById('tv');
  const on=tv.classList.toggle('tv-on');
  tv.setAttribute('aria-label',on?'Turn off the TV':'Turn on the TV');
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')) return close();
  if(e.target.closest('#lights')) return;
  const t=e.target.closest('[data-panel]');
  if(t){e.stopPropagation();open(t.dataset.panel);return;}
  const p=e.target.closest('[data-power]');
  if(p){e.stopPropagation();toggleTV();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.body.classList.contains('open')) return close();
  if(e.key==='Enter'||e.key===' '){
    const t=document.activeElement.closest?.('[data-panel]');
    if(t&&t.getAttribute('role')==='button'){e.preventDefault();open(t.dataset.panel);return;}
    const p=document.activeElement.closest?.('[data-power]');
    if(p&&p.getAttribute('role')==='button'){e.preventDefault();toggleTV();}
  }
});
const lights=document.getElementById('lights');
lights.addEventListener('click',()=>{
  const night=document.body.classList.toggle('night');
  lights.textContent=night?'turn the lights on':'turn the lights off';
  lights.setAttribute('aria-pressed',night);
});
document.getElementById('yr').textContent=new Date().getFullYear();
setTimeout(()=>document.body.classList.add('on'),400);
</script>
</body>
</html>
